<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8161D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0121A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="moduleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C3F7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F2A5C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8941F;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1000" height="600" fill="#F8F9FA"/>
  
  <!-- 标题 -->
  <text x="500" y="40" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="24" font-weight="bold" fill="#1C3F7A">主智能体功能架构示意图</text>
  
  <!-- 中心主智能体 -->
  <circle cx="500" cy="300" r="80" fill="url(#centerGradient)" filter="url(#shadow)"/>
  <circle cx="500" cy="300" r="70" fill="none" stroke="#D4AF37" stroke-width="3"/>
  
  <!-- 中心图标 -->
  <g transform="translate(500, 300)">
    <!-- 大脑图标 -->
    <path d="M-25,-15 C-30,-25 -20,-35 -10,-30 C0,-35 10,-30 15,-25 C20,-20 25,-10 20,0 C25,10 20,20 15,25 C10,30 0,35 -10,30 C-20,35 -30,25 -25,15 C-30,5 -25,-5 -25,-15 Z" 
          fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <!-- 神经网络节点 -->
    <circle cx="-15" cy="-10" r="3" fill="#D4AF37"/>
    <circle cx="0" cy="-15" r="3" fill="#D4AF37"/>
    <circle cx="15" cy="-10" r="3" fill="#D4AF37"/>
    <circle cx="-10" cy="5" r="3" fill="#D4AF37"/>
    <circle cx="10" cy="5" r="3" fill="#D4AF37"/>
    <circle cx="0" cy="15" r="3" fill="#D4AF37"/>
  </g>
  
  <!-- 中心标题 -->
  <text x="500" y="400" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="16" font-weight="bold" fill="#FFFFFF">主智能体</text>
  
  <!-- 功能模块1: 用户意图识别与自然语言理解 (左上) -->
  <g transform="translate(200, 120)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="url(#moduleGradient)" filter="url(#shadow)"/>
    <rect x="-75" y="-35" width="150" height="70" rx="8" fill="none" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- 图标 -->
    <g transform="translate(-50, -20)">
      <circle cx="0" cy="0" r="15" fill="#D4AF37"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="12" fill="#FFFFFF">AI</text>
    </g>
    
    <!-- 文本 -->
    <text x="0" y="5" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">用户意图识别与</text>
    <text x="0" y="20" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">自然语言理解</text>
  </g>
  
  <!-- 功能模块2: 任务调度与智能分配 (右上) -->
  <g transform="translate(800, 120)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="url(#moduleGradient)" filter="url(#shadow)"/>
    <rect x="-75" y="-35" width="150" height="70" rx="8" fill="none" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- 图标 -->
    <g transform="translate(-50, -20)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#D4AF37"/>
      <path d="M-8,-8 L8,-8 L8,8 L-8,8 Z M-4,-4 L4,-4 M-4,0 L4,0 M-4,4 L4,4" 
            stroke="#FFFFFF" stroke-width="2" fill="none"/>
    </g>
    
    <!-- 文本 -->
    <text x="0" y="5" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">任务调度与</text>
    <text x="0" y="20" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">智能分配</text>
  </g>
  
  <!-- 功能模块3: 风险提示与决策辅助 (左下) -->
  <g transform="translate(200, 480)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="url(#moduleGradient)" filter="url(#shadow)"/>
    <rect x="-75" y="-35" width="150" height="70" rx="8" fill="none" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- 图标 -->
    <g transform="translate(-50, -20)">
      <path d="M-15,-10 L15,-10 L10,10 L-10,10 Z" fill="#D4AF37"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFFFFF">!</text>
    </g>
    
    <!-- 文本 -->
    <text x="0" y="5" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">风险提示与</text>
    <text x="0" y="20" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">决策辅助</text>
  </g>
  
  <!-- 功能模块4: 数据分析与趋势预测 (右下) -->
  <g transform="translate(800, 480)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="url(#moduleGradient)" filter="url(#shadow)"/>
    <rect x="-75" y="-35" width="150" height="70" rx="8" fill="none" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- 图标 -->
    <g transform="translate(-50, -20)">
      <path d="M-15,-5 L-10,5 L-5,0 L0,10 L5,5 L10,0 L15,-5" 
            stroke="#D4AF37" stroke-width="3" fill="none"/>
      <circle cx="-15" cy="-5" r="2" fill="#D4AF37"/>
      <circle cx="0" cy="10" r="2" fill="#D4AF37"/>
      <circle cx="15" cy="-5" r="2" fill="#D4AF37"/>
    </g>
    
    <!-- 文本 -->
    <text x="0" y="5" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">数据分析与</text>
    <text x="0" y="20" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
          font-size="12" font-weight="bold" fill="#FFFFFF">趋势预测</text>
  </g>
  
  <!-- 连接线 -->
  <!-- 中心到左上模块 -->
  <path d="M 420 220 L 280 160" stroke="#C8161D" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 中心到右上模块 -->
  <path d="M 580 220 L 720 160" stroke="#C8161D" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 中心到左下模块 -->
  <path d="M 420 380 L 280 440" stroke="#C8161D" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 中心到右下模块 -->
  <path d="M 580 380 L 720 440" stroke="#C8161D" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C8161D"/>
    </marker>
  </defs>
  
  <!-- 数据流标签 -->
  <text x="350" y="190" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="10" fill="#666666">意图解析</text>
  
  <text x="650" y="190" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="10" fill="#666666">任务分配</text>
  
  <text x="350" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="10" fill="#666666">风险控制</text>
  
  <text x="650" y="410" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="10" fill="#666666">智能分析</text>
  
  <!-- 底部说明 -->
  <text x="500" y="570" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" 
        font-size="12" fill="#666666">基于大型语言模型与金融知识图谱的智能金融服务平台</text>
</svg>

